
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JournalAPK_Project_FIXED.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          if [ ! -f JournalAPK_Project_FIXED.zip ]; then
            echo "ERROR: JournalAPK_Project_FIXED.zip not found in repository root."
            ls -la
            exit 1
          fi
          mkdir project
          unzip -q JournalAPK_Project_FIXED.zip -d project
          cd project
          if [ ! -f settings.gradle.kts ] || [ ! -f gradlew ]; then
            echo "ERROR: Required Android project files are missing."
            find . -maxdepth 4 -type f
            exit 1
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd project
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradingJournal-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
